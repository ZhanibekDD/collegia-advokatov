<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f8f7f2"/><rect width="1400" height="86" fill="#fff"/><line x1="0" y1="86" x2="1400" y2="86" stroke="#dfe5e1"/><circle cx="66" cy="43" r="27" fill="#fff" stroke="#c59b55" stroke-width="2"/><circle cx="66" cy="43" r="21" fill="#0f5b7b"/><path d="M54 49c9-1 14-8 15-18 6 7 12 12 18 15-10 2-19 5-27 11z" fill="#e5b64d"/><text x="110" y="38" font-family="Arial" font-size="16" font-weight="700" fill="#0d1d19">КОЛЛЕГИЯ АДВОКАТОВ ОБЛАСТИ ЖЕТІСУ</text><text x="110" y="58" font-family="Arial" font-size="10" letter-spacing="2" fill="#71807a">ЖЕТІСУ · ПРАВОВАЯ ПОМОЩЬ</text><rect y="86" width="1400" height="208" fill="#0d1d19"/><text x="90" y="146" font-family="Arial" font-size="12" letter-spacing="2" fill="#d9eddf">— НАВИГАТОР ПРАВОВОЙ ПОМОЩИ</text><text x="90" y="204" font-family="Georgia" font-size="50" fill="#fff">Понятный маршрут за два шага</text><text x="90" y="246" font-family="Arial" font-size="16" fill="#cad6d1">Выберите ситуацию и срочность — сайт направит в региональный каталог Жетісу.</text><rect x="90" y="330" width="360" height="70" fill="#fff" stroke="#cdd7d2"/><circle cx="126" cy="365" r="18" fill="#123e32"/><text x="121" y="371" font-family="Arial" font-size="14" fill="#fff">1</text><text x="158" y="371" font-family="Arial" font-size="14" font-weight="700" fill="#123e32">СИТУАЦИЯ</text><rect x="465" y="330" width="360" height="70" fill="#fff" stroke="#cdd7d2"/><circle cx="501" cy="365" r="18" fill="#e7e9e5"/><text x="496" y="371" font-family="Arial" font-size="14" fill="#66716d">2</text><text x="533" y="371" font-family="Arial" font-size="14" font-weight="700" fill="#66716d">СРОЧНОСТЬ</text><text x="90" y="462" font-family="Georgia" font-size="36" fill="#0d1d19">Что произошло?</text><g transform="translate(90 500)"><g><rect width="230" height="165" fill="#fff" stroke="#dce2df"/><circle cx="42" cy="42" r="24" fill="#e6efe9"/><text x="34" y="50" font-family="Arial" font-size="22" fill="#123e32">§</text><text x="24" y="88" font-family="Arial" font-size="15" font-weight="700" fill="#0d1d19">Уголовное дело</text><text x="24" y="114" font-family="Arial" font-size="11" fill="#66716d">Задержание, допрос,</text><text x="24" y="133" font-family="Arial" font-size="11" fill="#66716d">обвинение или защита</text></g><g transform="translate(250 0)"><rect width="230" height="165" fill="#fff" stroke="#dce2df"/><circle cx="42" cy="42" r="24" fill="#efe4c9"/><text x="29" y="49" font-family="Arial" font-size="17" fill="#7b602d">01</text><text x="24" y="88" font-family="Arial" font-size="15" font-weight="700" fill="#0d1d19">Семья и дети</text><text x="24" y="114" font-family="Arial" font-size="11" fill="#66716d">Развод, алименты,</text><text x="24" y="133" font-family="Arial" font-size="11" fill="#66716d">дети и наследство</text></g><g transform="translate(500 0)"><rect width="230" height="165" fill="#fff" stroke="#dce2df"/><circle cx="42" cy="42" r="24" fill="#dce8ef"/><text x="34" y="50" font-family="Arial" font-size="20" fill="#315c73">₸</text><text x="24" y="88" font-family="Arial" font-size="15" font-weight="700" fill="#0d1d19">Бизнес</text><text x="24" y="114" font-family="Arial" font-size="11" fill="#66716d">Договоры, налоги,</text><text x="24" y="133" font-family="Arial" font-size="11" fill="#66716d">проверки и споры</text></g><g transform="translate(750 0)"><rect width="230" height="165" fill="#fff" stroke="#dce2df"/><circle cx="42" cy="42" r="24" fill="#e7ece7"/><text x="33" y="49" font-family="Arial" font-size="20" fill="#123e32">⌂</text><text x="24" y="88" font-family="Arial" font-size="15" font-weight="700" fill="#0d1d19">Имущество</text><text x="24" y="114" font-family="Arial" font-size="11" fill="#66716d">Недвижимость, земля</text><text x="24" y="133" font-family="Arial" font-size="11" fill="#66716d">и жилищные вопросы</text></g><g transform="translate(1000 0)"><rect width="230" height="165" fill="#123e32" stroke="#123e32"/><circle cx="42" cy="42" r="24" fill="#c59b55"/><text x="34" y="50" font-family="Arial" font-size="19" fill="#0d1d19">✓</text><text x="24" y="88" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Гражданский спор</text><text x="24" y="114" font-family="Arial" font-size="11" fill="#d9eddf">Долги, ущерб,</text><text x="24" y="133" font-family="Arial" font-size="11" fill="#d9eddf">обязательства и суд</text></g></g><rect x="1090" y="708" width="220" height="52" fill="#123e32"/><text x="1142" y="741" font-family="Arial" font-size="13" font-weight="700" fill="#fff">ПРОДОЛЖИТЬ →</text></svg>